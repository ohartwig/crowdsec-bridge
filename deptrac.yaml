deptrac:
  paths:
    - ./Classes

  layers:
    - name: Domain
      collectors:
        - type: directory
          value: Classes/Domain/.*
    - name: Application
      collectors:
        - type: directory
          value: Classes/Application/.*
    - name: Infrastructure
      collectors:
        - type: directory
          value: Classes/Infrastructure/.*
    - name: Presentation
      collectors:
        - type: directory
          value: Classes/Presentation/.*

  ruleset:
    Domain: []
    Application:
      - Domain
    Infrastructure:
      - Application
      - Domain
    Presentation:
      - Application
      - Domain

  skip_violations: {}
